# Publish to npm from a tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# No long-lived credential lives here. npm accepts an OIDC token minted by this
# workflow for this repository (trusted publishing), and `--provenance` signs an
# attestation linking the tarball to this run and this commit — which is the
# only way a consumer can check that what they installed came from what they can
# read. For a package whose whole claim is "no third-party code in your media
# path", that is not a nicety.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch: # re-run a failed publish without re-tagging

# Never `cancel-in-progress`: killing a run mid-publish is how you burn a
# version number for nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: the tag equals the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag disagrees with package.json ($manifest)"
            exit 1
          fi

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  npm:
    name: publish @voqalize/client-transport
    # Behind the full gate, all three engines included. A published version
    # number cannot be taken back, and the thing being published is a media
    # path — "it compiled" is not the bar.
    needs: [guard, ci]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for a publish grant
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing landed in npm 11.5.1. The install runs with pnpm and
      # the publish with npm on purpose: the OIDC exchange is npm's, and
      # `npm publish` reads the manifest rather than the store.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public

  github-release:
    name: github release
    needs: [guard, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
