# The gate. Two runners over one set of test bodies, because they answer
# different questions.
#
# The node run drives the contract suite over a fake `MediaDevices`: fast,
# exact, and able to script things no real browser will do (a device that
# vanishes *during* an in-flight `getUserMedia`). The browser run puts **the
# same bodies** in front of real chromium, firefox and webkit — a node pass
# that fails in a browser is a bug in our model of the browser, and that is
# the only thing that finds it.
#
# The engines are a matrix rather than one job because `playwright install`
# pulls a browser per shard; installing all three everywhere triples the
# download for no extra coverage.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs this before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, build, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        # Covers src/, lab/, tests/, e2e/ and every config file — the harness
        # is typechecked as strictly as the library, because the harness is
        # what the library's claims rest on.
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format
        run: pnpm format:check

      - name: build
        run: pnpm build

      - name: no remotely-loaded code
        # Asserted against the artifact consumers actually get, not the source:
        # dist must import nothing but the two declared peer dependencies, and
        # must never reach for the code evaluators. Comments are stripped
        # first — a doc block that happens to contain `from "..."` is not an
        # import, and one of ours does.
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const allowed = new Set([
              "@pipecat-ai/client-js",
              "@pipecat-ai/small-webrtc-transport",
            ]);
            let bad = false;
            for (const file of ["dist/index.js", "dist/index.cjs"]) {
              const source = readFileSync(file, "utf8")
                .replace(/\/\*[\s\S]*?\*\//g, "")
                .replace(/^\s*\/\/.*$/gm, "");
              for (const [, id] of source.matchAll(
                /(?:\bfrom|\brequire\()\s*["\x27]([^"\x27]+)["\x27]/g
              )) {
                if (!allowed.has(id)) {
                  console.log(`::error::${file} imports ${id}`);
                  bad = true;
                }
              }
              if (/\beval\(|new Function\(/.test(source)) {
                console.log(`::error::${file} evaluates code at runtime`);
                bad = true;
              }
            }
            if (bad) process.exit(1);
            console.log("dist imports only its peer dependencies");
          '

      - name: package contents
        # `files` has been wrong in other repos before, and dist/ is
        # gitignored — npm applies .gitignore inside a files entry.
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/*.tgz | sort
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

      - name: contract suite over the fake platform
        run: pnpm test:unit

  browsers:
    name: browser — ${{ matrix.engine }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false # one engine's failure is a finding, not a reason to stop measuring the others
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: install ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: the same contract bodies, in a real engine
        # `playwright.config.ts` starts its own Vite dev server, which also
        # mounts the controllable UDP relay the network suite drives. It binds
        # 127.0.0.1 and never `localhost`: Firefox gathers zero ICE candidates
        # on an [::1] origin (docs/FINDINGS.md).
        run: pnpm exec playwright test --project=${{ matrix.engine }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # `outputDir` in playwright.config.ts, which is where the traces and
          # the videos of a failed run land.
          name: playwright-traces-${{ matrix.engine }}
          path: .artifacts/
          retention-days: 14
