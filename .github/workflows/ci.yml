# The gate. Two tiers, because they answer different questions.
#
# Tier 1 is the contract suite over a fake `MediaDevices` in node: fast, exact,
# and able to script things no real browser will do (a device that vanishes
# *during* an in-flight `getUserMedia`). Tier 2 runs **the same test bodies**
# against real chromium, firefox and webkit — a tier-1 pass that fails tier 2
# is a bug in our model of the browser, and that is the only thing that finds
# it.
#
# The engines are a matrix rather than one job because `playwright install`
# pulls a browser per shard; installing all three everywhere triples the
# download for no extra coverage.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs this before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, build, tier 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        # Covers src/, lab/, tests/, e2e/ and every config file — the harness
        # is typechecked as strictly as the library, because the harness is
        # what the library's claims rest on.
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format
        run: pnpm format:check

      - name: build
        run: pnpm build

      - name: no Daily, no remotely-loaded code
        # The reason this package exists, asserted against the artifact
        # consumers actually get rather than against the source. `eval` and
        # `new Function` are what `@daily-co/daily-js` does with the JavaScript
        # it fetches at runtime; neither belongs in a media manager.
        run: |
          set -euo pipefail
          for f in dist/index.js dist/index.cjs; do
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
            if grep -qi 'daily' "$f"; then
              echo "::error::$f mentions daily"; exit 1
            fi
            if grep -qE 'eval\(|new Function\(' "$f"; then
              echo "::error::$f evaluates code at runtime"; exit 1
            fi
          done
          echo "dist is clean"

      - name: package contents
        # `files` has been wrong in other repos before, and dist/ is
        # gitignored — npm applies .gitignore inside a files entry.
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/*.tgz | sort
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

      - name: tier 1 — contract suite over the fake platform
        run: pnpm test:unit

  browsers:
    name: tier 2 — ${{ matrix.engine }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false # one engine's failure is a finding, not a reason to stop measuring the others
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: install ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: tier 2 — the same contract bodies, in a real engine
        # `playwright.config.ts` starts its own Vite dev server, which also
        # mounts the controllable UDP relay the network suite drives. It binds
        # 127.0.0.1 and never `localhost`: Firefox gathers zero ICE candidates
        # on an [::1] origin (docs/FINDINGS.md).
        run: pnpm exec playwright test --project=${{ matrix.engine }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # `outputDir` in playwright.config.ts, which is where the traces and
          # the videos of a failed run land.
          name: playwright-traces-${{ matrix.engine }}
          path: .artifacts/
          retention-days: 14
